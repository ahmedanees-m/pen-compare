name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # Unit tests
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}

      - name: Install core + dev extras
        run: |
          # Upstream PEN-STACK packages (genome-atlas, mech-class, pen-score,
          # pen-assemble) are pinned to versions that are not yet on PyPI.
          # Install pen-compare without deps, then supply the real scientific
          # stack so the pure-Python unit tests run correctly.
          pip install --no-deps -e .
          pip install \
            numpy>=1.24 pandas>=2.0 scipy>=1.10 scikit-learn>=1.3 \
            pyyaml>=6.0 pyarrow>=14.0 click>=8.0 tqdm>=4.66 \
            joblib>=1.3 pydantic>=2.5 \
            pytest>=7.4 pytest-cov>=4.1 pytest-asyncio>=0.23

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=pen_compare \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  # Release
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
