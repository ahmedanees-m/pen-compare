name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}

      - name: Install pen-compare (no upstream pins) + docs extras
        run: |
          pip install --no-deps -e .
          pip install             numpy>=1.24 pandas>=2.0 scipy>=1.10 scikit-learn>=1.3             pyyaml>=6.0 pyarrow>=14.0 click>=8.0 tqdm>=4.66             joblib>=1.3 pydantic>=2.5
          pip install             sphinx>=7.2 sphinx-rtd-theme>=2.0 myst-parser>=2.0             sphinx-copybutton>=0.5

      - name: Build Sphinx docs
        run: cd docs && sphinx-build -b html . _build/html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
